<html lang="ro">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/src/assets/fonts/valeria-serif.woff2" as="font" type="font/woff2" crossorigin />
  <title>Sprijin psihologic pentru copii și familii | Valeria Stănculea</title>
  <meta name="description" content="Sprijin psihologic pentru copii, adolescenți, părinți și familii. Cunoaște abordarea Valeriei Stănculea și trimite o solicitare." />
  <script>
   try {
    var theme = localStorage.getItem('lovable-ui-theme');
    var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.add(dark ? 'dark' : 'light');
   } catch (_) {
    document.documentElement.classList.add(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
   }
  </script>
 </head>
 <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
